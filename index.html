<style>
:root{--bg:#0a0a0a;--card:#161616;--line:#2c2c2c;--text:#f2f2f2;--mute:#8d8d8d;--or:#ff9000;--mono:'JetBrains Mono','Fira Code',ui-monospace,'Courier New',monospace}

body{background:var(--bg);color:var(--text);font:15px/1.6 var(--mono);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;width:100%}
main{flex:1;padding:32px 0 60px}
h1,h2,h3{font-weight:800;line-height:1.15;letter-spacing:-.02em}

em{color:var(--or);font-style:normal}

.logo{font-weight:800;font-size:18px}.logo b{background:var(--or);color:#000;padding:0 6px;margin-left:2px;border-radius:3px}
nav{display:flex;gap:4px;flex:1}

.search button{background:var(--or);color:#000;padding:0 10px}
.tools{display:flex;gap:8px;align-items:center;font-size:13px}
.burger{display:none;font-size:22px}
.btn{display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border-radius:6px;font-weight:700;background:var(--or);color:#000;border:1px solid var(--or)}
.btn:hover{filter:brightness(1.1)}.btn.out{background:none;color:#fff;border-color:#444}.btn.out:hover{border-color:var(--or)}
.btn:disabled{opacity:.35;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:13px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center;padding:20px 0 40px}

.row{display:flex;gap:12px;flex-wrap:wrap}
.fire-plate{border:1px solid var(--or);border-radius:10px;padding:24px;text-align:center;background:linear-gradient(160deg,#241400,#0e0e0e)}

.fire-plate b{display:block;margin-top:8px;color:var(--or)}.fire-plate small{color:var(--mute)}

section.s{margin-top:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}

.quiz{max-width:680px;margin:0 auto}

const Q={stage:'start',i:0,sel:null,done:false,ans:[]};
function quiz(arg){
 const sh=arg.s!==undefined?`<div class="banner">Твой друг набрал ${+arg.s} из ${QUIZ.length}. Сможешь лучше?</div>`:'';
 if(Q.stage==='start')return `<div class="quiz">${sh}<div class="box"><span class="eyebrow">Интерактивный тест</span><h1 style="margin:10px 0">Шаришь за внешнюю политику?</h1><p class="lead">${QUIZ.length} вопросов по теме проекта, после каждого ответа есть пояснение, бесконечность попыток прохождения.</p><div class="row" style="margin-top:24px"><button class="btn" data-act="qstart">Начать тест</button></div></div></div>`;
 if(Q.stage==='res'){
  const s=Q.ans.filter((a,i)=>a===QUIZ[i].c).length,p=Math.round(s/QUIZ.length*100);
  const t=p>=80?'Министр иностранных дел':p>=50?'Дипломат':'Стажёр в МИД';
  const m=p>=80?'Отличный результат, МИД уже ищет тебе кабинет.':p>=50?'Уверенно держишь курс. Загляни в ленту — там разборы по темам.':'Начало положено. Почитай ленту и возвращайся за реваншем.';
  return `<div class="quiz"><div class="box"><span class="eyebrow">Тест завершён</span><div class="score" style="margin:14px 0">${p}%</div><div class="meta">${s} из ${QUIZ.length} правильно</div><h1 style="margin:14px 0 8px;font-size:30px">${t}</h1><p class="lead">${m}</p>
  <div class="row" style="margin:22px 0"><button class="btn" data-act="qstart">Пройти ещё раз</button><button class="btn out" data-act="qshare">Поделиться ${I.share.replace('<svg','<svg width=16 height=16 style="fill:none;stroke:currentColor;stroke-width:1.8"')}</button></div>
  <h3>Разбор ответов</h3><div class="rev">${QUIZ.map((x,i)=>`<div>${x.a[Q.ans[i]]===x.a[x.c]?'✅':'❌'} ${esc(x.q)}<small>Правильно: ${esc(x.a[x.c])}</small></div>`).join('')}</div></div></div>`;
 }
 const x=QUIZ[Q.i],n=Q.i+1;
 return `<div class="quiz"><div class="box"><div class="meta">Вопрос ${n} из ${QUIZ.length}</div><div class="bar2"><i style="width:${n/QUIZ.length*100}%"></i></div><h2>${esc(x.q)}</h2>
 ${x.a.map((a,i)=>`<button class="ans ${Q.done?(i===x.c?'ok':i===Q.sel?'bad':''):(Q.sel===i?'sel':'')}" data-act="qpick" data-i="${i}" ${Q.done?'disabled':''}><b style="color:var(--or)">${'ABCD'[i]}</b> &nbsp;${esc(a)}</button>`).join('')}
 ${Q.done?`<p class="why">💡 ${esc(x.w)}</p>`:''}
 <div style="margin-top:16px">${Q.done?`<button class="btn" data-act="qnext">${n===QUIZ.length?'Показать результат':'Дальше →'}</button>`:`<button class="btn" data-act="qcheck" ${Q.sel===null?'disabled':''}>Ответить</button>`}</div></div></div>`;
}

 <section class="s"><h2>Почему сайт? для того чтобы ...</h2><div class="grid"><div class="panel"><h3>Объяснить понятно</h3><p class="meta" style="margin-top:8px">Конституцию, концепцию и международные термины переводим на человеческий язык.</p></div><div class="panel"><h3>Проверить себя</h3><p class="meta" style="margin-top:8px">В тесте ${QUIZ.length} вопросов с пояснениями, чтобы запомнить, а не просто угадать.</p></div><div class="panel"><h3>Не заскучать</h3><p class="meta" style="margin-top:8px">Факты и мемы помогают запомнить, при условии, что за шуткой стоит правда.</p></div></div></section>
 <section class="s"><h2>Команда</h2><div class="team">${USERS.map(u=>`<div class="card"><div class="av">${PHOTOS[u.n]?`<img src="${esc(PHOTOS[u.n])}" alt="">`:u.n[0]}</div><h3>${u.n}</h3><span class="meta"></span></div>`).join('')}</div></section>`;
}

/* ============ РОУТЕР ============ */
function render(){
 const [path,qs]=(location.hash.slice(2)||'home').split('?'),[page,arg]=path.split('/'),p=Object.fromEntries(new URLSearchParams(qs||''));
 const views={home,quiz:()=>quiz(p),facts,feed,about,login,saved:savedPage,item:()=>item(arg),search:()=>results(p.q||'')};
 $('#app').innerHTML=(views[page]||home)();
 $('#nav').innerHTML=NAV.map(([id,l])=>`<a href="#/${id}" class="${id===page?'on':''}">${l}</a>`).join('');
 $('#tools').innerHTML=`<a href="#/saved" class="meta" title="Сохранённое">🔖 ${saved.length}</a>`+(user?`<a href="#/login" class="tag">${esc(user.n)}</a>`:`<a class="btn sm out" href="#/login">Войти</a>`);
 $('#nav').classList.remove('open');
}
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)};
async function share(title,url){
 if(navigator.share){try{await navigator.share({title,url});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url)}catch{const a=document.createElement('textarea');a.value=url;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
 toast('Ссылка скопирована');
}

/* ============ СОБЫТИЯ ============ */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id,x=id&&byId(id);
 if(a==='burger')$('#nav').classList.toggle('open');
 else if(a==='like'){likes=likes.includes(id)?likes.filter(i=>i!==id):[...likes,id];put('vp_likes',likes);render()}
 else if(a==='save'){saved=saved.includes(id)?saved.filter(i=>i!==id):[...saved,id];put('vp_saved',saved);toast(saved.includes(id)?'Сохранено':'Убрано из сохранённого');render()}
 else if(a==='share')share(x.title,link('item/'+id));
 else if(a==='ffilter'){fFilter=b.dataset.v;render()}
 else if(a==='cat'){cat=b.dataset.v;render()}
 else if(a==='sort'){sort=b.dataset.v;render()}
 else if(a==='del'&&confirm('Удалить этот пост?')){mine=mine.filter(i=>i.id!==id);put('vp_posts',mine);render()}
 else if(a==='logout'){user=null;put('vp_user',null);location.hash='/home';render()}
 else if(a==='qstart'){Object.assign(Q,{stage:'q',i:0,sel:null,done:false,ans:[]});history.replaceState(null,'','#/quiz');render()}
 else if(a==='qpick'){Q.sel=+b.dataset.i;render()}
 else if(a==='qcheck'){Q.done=true;Q.ans[Q.i]=Q.sel;render()}
 else if(a==='qnext'){if(Q.i===QUIZ.length-1)Q.stage='res';else{Q.i++;Q.sel=null;Q.done=false}render();scrollTo(0,0)}
 else if(a==='qshare'){const s=Q.ans.filter((v,i)=>v===QUIZ[i].c).length;share(`Я набрал ${s} из ${QUIZ.length} в тесте по внешней политике`,link('quiz?s='+s))}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='sf'){const v=$('#q').value.trim();if(v)location.hash='/search?q='+encodeURIComponent(v)}
 else if(f.id==='lf'){const d=new FormData(f),u=USERS.find(u=>u.e===d.get('e').trim().toLowerCase()&&u.p===d.get('p'));
  if(!u){$('#lerr').textContent='Неверная почта или пароль';return}
  user={n:u.n,e:u.e};put('vp_user',user);location.hash='/feed'}
 else if(f.id==='pf'&&user){const d=new FormData(f),n=new Date();
  mine=[{id:'u'+Date.now(),type:'news',tag:d.get('g'),title:d.get('t').trim(),text:d.get('x').trim(),img:d.get('i').trim(),by:user.n,base:0,date:n.toISOString().slice(0,10),time:n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})},...mine];
  put('vp_posts',mine);toast('Пост опубликован');render()}
});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();
</script>
</body>
</html>
